# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Xavierの博客  # 网站标题
subtitle: '记录代码，也记录生活'  # 网站子标题
description: '在代码与日常之间，记录一点成长'  # 网站描述
keywords:
author: xxxxi # 网站作者
language: zh-CN # 网站语言
timezone: '' # 网站时区

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://XI776.github.io/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source  #  资源文件夹，这个文件夹用来存放内容，例如我门用markdown编写的blog
public_dir: public  #  公共文件夹，这个文件夹用于存放生成的静态博客文件。
tag_dir: tags  #  标签文件夹
archive_dir: archives  #  归档文件夹
category_dir: categories  #  分类文件夹
code_dir: downloads/code  #  Include code 文件夹
i18n_dir: :lang  #  国际化（i18n）文件夹
skip_render:  #  跳过指定文件的渲染，可以使用 glob 来配置路径

# Search
search:
  path: search.xml # 索引文件的路径，相对于站点根目录
  field: post # 搜索范围，默认是 post ，还可以选择 page，all，设置成all表示搜索所有页面
  format: html
  limit: 10000 # 限制搜索的条目数
 
marked:
  gfm: true
  pedantic: false
  sanitize: false
  tables: true
  breaks: false
  smartLists: true
  smartypants: true
  modifyAnchors: ''
  autolink: true

# Writing
new_post_name: :title.md # File name of new posts # 默认的新博文名称
default_layout: post # 默认布局
titlecase: false # Transform title into titlecase # 将每个单词首字母转换成大写）
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0 #文件名称转化为（1）小写，（2）大写，0表示不变
render_drafts: false # 是否显示草稿
post_asset_folder: true # 是否启用资源文件夹（用来存放相对路径图片或文件）
relative_link: false # 把链接改为与根目录的相对位址
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true # 是否开启代码高亮
  line_number: true # 是否增加代码行号
  auto_detect: true # 自动判断代码语言
  tab_replace: ''
  wrap: true
  hljs: true # 输出 highlight.js 语法标记
  language_attr: true
  custom_theme: false
  theme: monokai
prismjs:
  preprocess: false
  line_number: false
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''  # 博客的默认路径
  per_page: 10  # 每页博客数量上限
  order_by: -date # 博客排序

# Category & Tag
default_category: uncategorized # 默认分类， uncategorized 表示未分类
category_map: # 分类别名
tag_map: # 标签别名

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD # 博客日期格式
time_format: HH:mm:ss # 博客时间格式
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10 # 每页显示的文章量，如果设置值为0，则表示禁止分页
pagination_dir: page # 分页目录

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly # 博客主题

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:XI776/XI776.github.io.git
  branch: master

# hexo-tag-cloud
tag_cloud:
    textFont: Trebuchet MS, Helvetica
    textColor: '#333'
    textHeight: 25
    outlineColor: '#E2E1D1'
    maxSpeed: 0.5
    pauseOnSelected: false # true 意味着当选中对应 tag 时,停止转动

symbols_count_time:
  symbols: true
  time: true
  total_symbols: true
  total_time: true
  exclude_codeblock: false
  awl: 4
  wpm: 275
  suffix: "mins."
